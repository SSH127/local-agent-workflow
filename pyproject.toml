[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-agent-workflow"
version = "0.3.6"
description = "Local-first CLI/API Agent workflow orchestration"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "langgraph>=0.2.60",
  "pydantic>=2.9,<3.0",
  "python-dotenv>=1.0,<2.0",
  # Runtime: DeepSeek chat client (app/agents/llm.py) and check_http.
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
